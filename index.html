<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fb" id="themeColor">
    <meta name="description" content="GLP-1 News 聚合中国 GLP-1 领域新闻，按五维评分、质量分和事件聚类呈现。">
    <title>China GLP-1 HOT</title>
    <link rel="stylesheet" href="styles.css?v=20260528-mobilefix2">
  </head>
  <body>
    <div class="shell" id="appShell">
      <aside class="sidebar" aria-label="主导航">
        <button class="drawer-close" type="button" aria-label="关闭菜单">×</button>
        <a class="brand" href="./" aria-label="China GLP-1 HOT 首页">
          <span>
            <span class="brand-name">China GLP-1 HOT</span>
            <span class="brand-subtitle">China-first signal feed</span>
          </span>
        </a>
        <nav class="side-nav" aria-label="内容视图">
          <button class="side-link active" data-view="selected" data-short="精" type="button">精选</button>
          <button class="side-link" data-view="all" data-short="全" type="button">全部</button>
          <a class="side-link module-link" href="dashboard.html">舆情看板</a>
        </nav>
        <div class="side-panel">
          <div class="panel-kicker">更新</div>
          <div id="generatedAt" class="panel-value">--</div>
        </div>
        <div class="side-panel compact">
          <div class="panel-kicker">事件</div>
          <div id="eventCount" class="panel-value">--</div>
        </div>
        <div class="theme-switch" aria-label="显示模式">
          <button class="theme-button active" data-theme-choice="light" type="button" aria-label="白天模式">☀</button>
          <button class="theme-button" data-theme-choice="dark" type="button" aria-label="夜晚模式">☾</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="menu-toggle mobile-menu-toggle" type="button" aria-label="展开菜单" aria-expanded="false">☰</button>
          <a class="mobile-brand" href="./" aria-label="China GLP-1 HOT 首页">
            <span class="brand-name">China GLP-1 HOT</span>
          </a>
          <div class="view-toggle" aria-label="内容视图">
            <button class="view-chip active" data-view="selected" type="button">精选</button>
            <button class="view-chip" data-view="all" type="button">全部</button>
          </div>
        </header>

        <section class="toolbar" aria-label="筛选">
          <div class="toolbar-head">
            <div>
              <h1>China GLP-1 HOT</h1>
              <p>AI 自动挑选的高价值新闻内容</p>
            </div>
            <div class="score-note">
              <span>5D</span>
              <strong>代码精选</strong>
            </div>
          </div>
          <div class="filters">
            <label class="search">
              <span class="search-icon">⌕</span>
              <input id="searchInput" type="search" placeholder="搜索标题、摘要、公司、药物…" autocomplete="off">
            </label>
            <div class="category-strip" id="categoryFilter" aria-label="主题筛选">
              <button class="category-chip active" data-category="" type="button">全部</button>
              <button class="category-chip" data-category="regulatory_approval" type="button">监管审批</button>
              <button class="category-chip" data-category="clinical_trial" type="button">临床试验</button>
              <button class="category-chip" data-category="company" type="button">药企动态</button>
              <button class="category-chip" data-category="commercialization" type="button">商业化/医保</button>
              <button class="category-chip" data-category="safety" type="button">安全性</button>
              <button class="category-chip" data-category="investment" type="button">投融资</button>
              <button class="category-chip" data-category="research" type="button">研究进展</button>
            </div>
          </div>
        </section>

        <section id="timeline" class="timeline" aria-live="polite"></section>
        <section id="emptyState" class="empty" hidden>
          <h2>没有匹配的新闻</h2>
          <p>换一个关键词或筛选条件试试。</p>
        </section>
      </main>
    </div>

    <template id="dayTemplate">
      <section class="day">
        <div class="day-head">
          <h2></h2>
          <span></span>
        </div>
        <div class="day-items"></div>
      </section>
    </template>

    <template id="cardTemplate">
      <article class="news-card">
        <div class="time"></div>
        <div class="card-body">
          <div class="card-meta">
            <span class="source"></span>
            <span class="badge selected-badge">精选</span>
            <span class="badge verification"></span>
            <span class="score"></span>
          </div>
          <a class="title"></a>
          <p class="summary"></p>
          <div class="tags"></div>
          <div class="score-grid"></div>
          <button class="related-toggle" type="button" hidden></button>
          <div class="related-list" hidden></div>
        </div>
      </article>
    </template>

    <div class="drawer-backdrop" aria-hidden="true"></div>
    <script src="app.js?v=20260528-mobilefix2" defer></script>
  </body>
</html>
